name: Example - Build and Upload Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example: ARM GCC Build
      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build firmware
        run: |
          echo "Building firmware..."
          # Replace with your actual build commands
          # make clean
          # make all

          # For demo purposes, create sample files
          mkdir -p build
          echo "Sample binary content" > build/firmware.bin
          echo "Sample hex content" > build/firmware.hex
          echo "Sample map content" > build/firmware.map

      # Upload to EmbedHub (only on main branch and tags)
      - name: Upload firmware to EmbedHub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: embedhub/embedhub-action@v1
        with:
          api-key: ${{ secrets.EMBEDHUB_API_KEY }}
          organization: ${{ secrets.EMBEDHUB_ORG }}
          project: ${{ secrets.EMBEDHUB_PROJECT }}
          files: 'build/*.{bin,hex,map}'
          path: 'releases/${{ github.ref_name }}/'

      # Upload PDFs/documentation
      - name: Upload documentation to EmbedHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: embedhub/embedhub-action@v1
        with:
          api-key: ${{ secrets.EMBEDHUB_API_KEY }}
          organization: ${{ secrets.EMBEDHUB_ORG }}
          project: ${{ secrets.EMBEDHUB_PROJECT }}
          files: 'docs/*.pdf'
          path: 'documents/'

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/*
          draft: false
          prerelease: false
